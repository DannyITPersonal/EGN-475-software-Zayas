
{% extends "base.html" %}

{% block title %}{{ item.name }} - Cafe Calle Ocho{% endblock %}

{% block content %}

<h1>{{ item.name }}</h1>

<article>
    <p><strong>Category:</strong> {{ item.category }}</p>

    <p>
        <strong>Price:</strong>
        ${{ "%.2f"|format(item.price_cents / 100) }}
    </p>

    <p>Thank you for choosing Cafe Calle Ocho!</p>

    <a href="{{ url_for('menu') }}">Back to Menu</a>
</article>

{% endblock %}
